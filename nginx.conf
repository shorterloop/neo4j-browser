# nginx.conf template — NEO4J_INTERNAL_HOST is replaced at container start
# by docker-entrypoint.sh using envsubst.
#
# Serves the Neo4j Browser static assets on port 8080 and proxies Bolt
# WebSocket traffic to the Neo4j service on Railway's internal network,
# keeping port 7687 off the public internet.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Proxy Bolt WebSocket traffic to the internal Neo4j service.
        # Browser connects to wss://<this-host>/bolt; nginx forwards it
        # to the Railway-internal hostname set in NEO4J_INTERNAL_HOST.
        location /bolt {
            proxy_pass http://${NEO4J_INTERNAL_HOST}:7687;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Serve the React SPA; fall back to index.html for client-side routes.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
