# nginx.conf template for Railway deployment.
#
# Three things happen at the root path (/):
#   1. WebSocket upgrade requests (Bolt protocol) are proxied to the
#      Neo4j service on Railway's internal network.
#   2. XHR/fetch requests from the app (the discovery call) receive a
#      Neo4j-compatible JSON response so the app learns the bolt URL.
#   3. Browser navigation requests (Accept: text/html) receive the SPA.
#
# NEO4J_BOLT_HOST and NEO4J_BOLT_PORT are substituted by docker-entrypoint.sh.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json;

    map $http_upgrade $connection_upgrade {
        websocket upgrade;
        default   close;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Root path: multiplex WebSocket, discovery XHR, and browser navigation.
        location = / {
            # (1) WebSocket — forward Bolt traffic to Neo4j on the internal network.
            # The Neo4j JS driver connects to wss://<domain>:443/ which Railway
            # terminates and forwards here as a plain WebSocket upgrade.
            error_page 418 = @bolt_proxy;
            if ($http_upgrade = "websocket") {
                return 418;
            }

            # (2) Browser navigation (text/html) — serve the React SPA.
            error_page 419 = @spa_index;
            if ($http_accept ~* "text/html") {
                return 419;
            }

            # (3) XHR discovery call from within the app — return the
            # generated Neo4j discovery JSON so the app auto-connects.
            add_header Content-Type application/json;
            try_files /browser-discovery.json =404;
        }

        # Bolt WebSocket proxy to Neo4j internal hostname
        location @bolt_proxy {
            proxy_pass http://${NEO4J_BOLT_HOST}:${NEO4J_BOLT_PORT};
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SPA index fallback for browser navigation to /
        location @spa_index {
            try_files /index.html =404;
        }

        # Static assets and SPA client-side routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
